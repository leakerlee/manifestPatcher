name: Java Build with Maven

on:
  push:
    branches: [ main ] # 当你推送到 main 分支时自动触发
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest # 使用 GitHub 提供的免费 Linux 环境

    steps:
    - name: checkout source code
      uses: actions/checkout@v4 # 1. 拉取代码
    - name: Set up JDK 17
      uses: actions/setup-java@v4 # 2. 配置 Java 环境
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Clean and Build with Maven
      run: mvn clean package -U --batch-mode --no-transfer-progress # 3. 使用 Maven 编译并打包

    - name: Upload Build Artifact # 4. 把打包好的 JAR 上传到 GitHub 的 Artifacts 区
      uses: actions/upload-artifact@v4
      with:
        name: ManifestPatcher-Jar
        path: target/*-jar-with-dependencies.jar
        if-no-files-found: error
