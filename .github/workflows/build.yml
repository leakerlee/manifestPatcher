name: Java Build with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven Clean + Build
        run: mvn clean package -U --batch-mode --no-transfer-progress

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManifestPatcher-Jar
          path: target/*-jar-with-dependencies.jar
          if-no-files-found: error
